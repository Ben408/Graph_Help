<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Help</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f5f6f8;
      }
      #frame {
        border: 0;
        width: 100%;
        height: 100%;
      }
      #status {
        display: none;
        padding: 16px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #e2e8f0;
      }
      #status a {
        color: #5eead4;
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <iframe id="frame" title="Smart Help panel"></iframe>
    <script src="sidepanel.js"></script>
  </body>
</html>
